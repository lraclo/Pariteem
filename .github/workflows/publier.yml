# Publie une version à chaque tag vX.Y.Z : le .crx signé et update.xml deviennent des fichiers de la Release.
# Les Chrome inscrits à Chrome Enterprise Core lisent update.xml et se mettent à jour d'eux-mêmes.
name: Publier

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run crx
        env:
          CLE_CRX: ${{ secrets.CLE_CRX }}
      - run: gh release create "$GITHUB_REF_NAME" .output/pariteem.crx .output/update.xml --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
